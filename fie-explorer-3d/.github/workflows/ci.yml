name: CI — FIE Explorer 3D

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend — Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: cd backend && npm ci
      - name: Verificar sintaxis
        run: cd backend && node -e "require('./app')" && echo "app.js OK"

  frontend-build:
    name: Frontend — Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: cd frontend && npm ci
      - name: Build de producción
        run: cd frontend && npm run build

  docker-compose-check:
    name: Docker Compose — validar sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet && echo "docker-compose.yml válido"
