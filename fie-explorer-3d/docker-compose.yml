
services:

  # ─── Backend Node.js ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fie_backend
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      PORT:          4000
      DB_HOST:       host.docker.internal
      DB_PORT:       5432
      DB_NAME:       fie_explorer_3d
      DB_USER:       postgres
      DB_PASSWORD:   postgres
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ─── Frontend Vite (dev) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fie_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules


